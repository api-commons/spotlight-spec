name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # The Jekyll we develop against. Fast, and matches a local `jekyll serve`.
  build:
    name: Jekyll 4 (what we develop on)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - run: bundle exec jekyll build

  # The build that actually predicts the deploy. GitHub Pages ignores the root
  # Gemfile and runs the `github-pages` gem (Jekyll 3.10), which accepts less
  # Liquid than Jekyll 4 — see .github/Gemfile.pages. Without this job, CI stays
  # green while pages-build-deployment fails and the site silently serves stale.
  pages-parity:
    name: GitHub Pages (what actually deploys)
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/.github/Gemfile.pages
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - run: bundle exec jekyll build
